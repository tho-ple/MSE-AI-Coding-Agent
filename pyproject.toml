[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-harness"
version = "0.2.0"
description = "Stage 2 coding-agent harness built on LangGraph: navigation, bounded context, saved sessions"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain-core>=1.0",
    "langchain-ollama>=1.0",
    "psutil>=5.9",
    "pydantic>=2",
    "pyyaml>=6",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
harness = "coding_harness.cli:main"

[tool.setuptools.packages.find]
include = ["coding_harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["fixtures"]
